# Dán hai khối này vào trong khối server { ... } của amnui.myska.blog
# (tệp /etc/nginx/sites-available/amnui), phía trên "location / {".

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location ^~ /server/ {
        deny all;
    }
