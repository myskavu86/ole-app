<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Am Núi — mỗi ngày một công án</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="panel">
  <canvas id="world" aria-label="Ngọn núi và ngôi am"></canvas>

  <header>
    <div class="brand">Am Núi</div>
    <div class="hud">
      <span id="lamps" title="Đèn đã thắp"></span>
      <button id="btnJournal" class="link">Sổ tay</button>
    </div>
  </header>

  <p id="hint" role="status"></p>

  <div id="controls">
    <button id="action" class="btn" hidden></button>
    <div class="pads">
      <button id="back" class="pad small" aria-label="Lùi lại">↓</button>
      <button id="walk" class="pad" aria-label="Giữ để bước lên">Giữ để<br>bước</button>
      <span class="pad small ghost"></span>
    </div>
  </div>

  <main id="app" aria-live="polite"></main>

  <script src="koans.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
