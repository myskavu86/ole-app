<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Anh công sở: bản thử</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  /* Ý tưởng: một hộp thư công việc giả lập. Tin đến, bạn chọn câu để gửi, người kia đáp lại. */
  --bg: #ECF0EC;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #56636F;
  --line: #C9D2CD;
  --you: #2A49E8;
  --you-ink: #FFFFFF;
  --mark: #F6E64B;
  --mark-ink: #1B1A05;
  --display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0F151B; --surface: #1C262F; --ink: #EEF2EE; --muted: #A3B2BE; --line: #35434F; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0F151B; --surface: #1C262F; --ink: #EEF2EE; --muted: #A3B2BE; --line: #35434F; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
main { max-width: 480px; margin: 0 auto; padding: 18px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
button { font-family: inherit; cursor: pointer; color: inherit; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--you); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -0.5px; }
h1 mark { background: var(--mark); color: var(--mark-ink); padding: 0 6px; border-radius: 6px; }
.today { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.today b { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); line-height: 1; }

.packs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.packs::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 22px; background: transparent; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1.5px solid var(--line); }
.mode { min-height: 44px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.mode[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--you); }

.thread { display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 20px; background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.who-name { font-weight: 600; font-size: 14px; }
.who-meta { font-size: 12px; color: var(--muted); }
.day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); border: 1.5px solid var(--line); border-radius: 12px; padding: 2px 10px; margin-top: 8px; }
.narr { align-self: center; text-align: center; max-width: 34ch; font-size: 13px; color: var(--muted); font-style: italic; }
.bubble { max-width: 88%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.35; }
.bubble.in { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 6px; }
.bubble.in.lead { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; }
.bubble.out { align-self: flex-end; background: var(--you); color: var(--you-ink); border-bottom-right-radius: 6px; font-weight: 500; }
.dots { display: inline-flex; gap: 5px; padding: 4px 0; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .bubble, .coach, .tray { animation: pop .28s ease-out; }
  .dots i { animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
}
@keyframes pop { from { transform: translateY(8px) scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

.tray { display: flex; flex-direction: column; gap: 8px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.tray-label { font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.draft { text-align: left; min-height: 56px; padding: 10px 14px; border: 1.5px solid var(--you); border-radius: 18px 18px 6px 18px; background: transparent; font-size: 15px; line-height: 1.35; display: flex; flex-direction: column; gap: 2px; }
.draft small { font-size: 12px; font-weight: 600; color: var(--you); }
:root[data-theme="dark"] .draft small { color: #9DB0FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .draft small { color: #9DB0FF; } }
.draft:hover { background: color-mix(in srgb, var(--you) 10%, transparent); }
.draft.odd { border-color: var(--mark-ink); background: var(--mark); color: var(--mark-ink); }
.draft.odd span { text-decoration: underline wavy; text-underline-offset: 4px; }
.draft.odd small { color: var(--mark-ink); }
.draft.fine { border-style: solid; opacity: .75; }
.draft:disabled { cursor: default; }

.coach { background: var(--mark); color: var(--mark-ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; transform: rotate(-0.6deg); }
.coach h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 17px; }
.coach p { margin: 0; font-size: 14px; }
.coach details { font-size: 14px; }
.coach summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.alt { border-top: 1px solid rgba(27, 26, 5, .25); padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
.alt b { font-weight: 600; }
.alt small { font-size: 12px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--mark-ink); border-radius: 22px; background: transparent; color: var(--mark-ink); font-size: 13px; font-weight: 600; }
.mini[aria-pressed="true"] { background: var(--mark-ink); color: var(--mark); }
.next { min-height: 52px; border: 0; border-radius: 26px; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 600; }
.score { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.book { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.book h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 18px; }
.book div { background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Hộp thư <mark>công sở</mark></h1>
    <div class="today"><b id="count">0</b>tin đã trả lời</div>
  </div>

  <div class="packs" id="packs" role="group" aria-label="Chọn ngành"></div>

  <div class="modes" role="tablist" aria-label="Dạng nội dung">
    <button class="mode" role="tab" data-mode="qa" id="mode-qa">Tin nhắn</button>
    <button class="mode" role="tab" data-mode="odd" id="mode-odd">Câu nghe kỳ</button>
    <button class="mode" role="tab" data-mode="story" id="mode-story">Truyện tuần</button>
  </div>

  <section class="thread" id="thread" aria-live="polite"></section>
  <section id="tray"></section>
  <section class="book" id="book"></section>

  <footer>Bản thử nội dung, chưa qua người duyệt. Câu đã lưu chỉ nằm trên máy này.</footer>
</main>

<script src="content.js"></script>
<script src="reactions.js"></script>
<script>
(function () {
  var C = window.CONTENT, R = window.REACTIONS;
  var qaAll = C.items.filter(function (it) { return it.type === 'qa'; });
  var state = { pack: 'chung', mode: 'qa', idx: 0, ep: 0, count: 0, right: 0, tried: 0 };
  var scene = 0; // tăng mỗi lần đổi cảnh để hủy các hiệu ứng đang chờ
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem('oe_saved') || '[]'); } catch (e) { saved = []; }
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $thread = document.getElementById('thread'), $tray = document.getElementById('tray');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, calm ? 0 : ms); }); }
  function packName(id) { for (var i = 0; i < C.packs.length; i++) if (C.packs[i].id === id) return C.packs[i].name; return id; }
  function add(html) {
    var d = document.createElement('div'); d.innerHTML = html; var el = d.firstElementChild;
    $thread.appendChild(el);
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
    return el;
  }
  async function incoming(text, lead, token) {
    var el = add('<div class="bubble in"><span class="dots" aria-label="Đang soạn tin"><i></i><i></i><i></i></span></div>');
    await sleep(750);
    if (token !== scene) return false;
    el.className = 'bubble in' + (lead ? ' lead' : '');
    el.textContent = text;
    return true;
  }
  function saveBtn(en) { var on = saved.indexOf(en) !== -1; return '<button class="mini" data-save="' + esc(en) + '" aria-pressed="' + on + '">' + (on ? 'Đã lưu' : 'Lưu vào sổ tay') + '</button>'; }
  function speakBtn(en) { return '<button class="mini" data-speak="' + esc(en) + '">Nghe</button>'; }

  function header() {
    document.getElementById('packs').innerHTML = C.packs.map(function (p) {
      return '<button class="chip" data-pack="' + p.id + '" aria-pressed="' + (p.id === state.pack) + '">' + esc(p.name) + '</button>';
    }).join('');
    ['qa', 'odd', 'story'].forEach(function (m) { document.getElementById('mode-' + m).setAttribute('aria-selected', String(m === state.mode)); });
    document.getElementById('count').textContent = state.count;
    document.getElementById('book').innerHTML = saved.length
      ? '<h2>Sổ tay của bạn (' + saved.length + ')</h2>' + saved.map(function (s) { return '<div>' + esc(s) + '</div>'; }).join('')
      : '';
  }

  // ----- Một lượt hội thoại: tin đến, chọn câu gửi, người kia đáp, ghi chú -----
  async function turn(item, reactions, nextLabel, onNext) {
    var token = scene;
    add('<div class="who"><div class="avatar" aria-hidden="true">' + esc(item.from.charAt(0)) + '</div><div><div class="who-name">' + esc(item.from) + '</div>' +
      (item.group ? '<div class="who-meta">' + esc(packName(item.pack)) + ' · ' + esc(item.group) + '</div>' : '') + '</div></div>');
    if (!(await incoming(item.quote, true, token))) return;
    $tray.innerHTML = '<div class="tray"><div class="tray-label">Chọn câu để gửi</div>' + item.answers.map(function (a, k) {
      return '<button class="draft" data-send="' + k + '"><small>' + esc(a.tag) + '</small><span>' + esc(a.en) + '</span></button>';
    }).join('') + '</div>';
    $tray.onclick = async function (e) {
      var b = e.target.closest('[data-send]'); if (!b || token !== scene) return;
      var k = Number(b.dataset.send), a = item.answers[k];
      $tray.onclick = null; $tray.innerHTML = '';
      add('<div class="bubble out">' + esc(a.en) + '</div>');
      state.count++; header();
      await sleep(350);
      if (reactions && reactions[k]) { if (!(await incoming(reactions[k], false, token))) return; }
      await sleep(250); if (token !== scene) return;
      var others = item.answers.filter(function (_, j) { return j !== k; });
      add('<div class="coach"><h3>' + esc(a.tag) + '</h3><p>' + esc(a.note) + '</p><div class="acts">' + speakBtn(a.en) + saveBtn(a.en) + '</div>' +
        '<details><summary>Xem 2 cách trả lời còn lại</summary>' + others.map(function (o) {
          return '<div class="alt"><b>' + esc(o.en) + '</b><small>' + esc(o.tag) + ': ' + esc(o.note) + '</small><div class="acts">' + speakBtn(o.en) + saveBtn(o.en) + '</div></div>';
        }).join('') + '</details></div>');
      $tray.innerHTML = '<div class="tray"><button class="next" data-next="1">' + esc(nextLabel) + '</button></div>';
      $tray.onclick = function (ev) { if (ev.target.closest('[data-next]')) { $tray.onclick = null; onNext(); } };
    };
  }

  function playQa() {
    var items = qaAll.filter(function (it) { return it.pack === state.pack || it.pack === 'chung'; })
      .sort(function (a, b) { return (a.pack === state.pack ? 0 : 1) - (b.pack === state.pack ? 0 : 1); });
    var it = items[state.idx % items.length];
    $thread.innerHTML = ''; $tray.innerHTML = '';
    turn(it, R.qa[qaAll.indexOf(it)], 'Tin nhắn tiếp theo', function () { state.idx++; scene++; playQa(); });
  }

  function playStory(fresh) {
    var st = C.items.filter(function (it) { return it.type === 'story' && it.pack === state.pack; })[0];
    if (fresh) { $thread.innerHTML = ''; }
    $tray.innerHTML = '';
    if (!st) { $thread.innerHTML = '<p class="empty">Gói ' + esc(packName(state.pack)) + ' chưa có truyện. Bản thử hiện có một truyện ở gói Xuất nhập khẩu.</p>'; return; }
    var n = st.episodes.length, cur = state.ep % n, ep = st.episodes[cur];
    if (cur === 0) { $thread.innerHTML = ''; add('<div class="narr"><b>' + esc(st.title) + '</b>, truyện ' + n + ' tập</div>'); }
    add('<div class="day">' + esc(ep.day) + ' · Tập ' + (cur + 1) + '/' + n + '</div>');
    add('<div class="narr">' + esc(ep.recap) + '</div>');
    turn({ from: ep.from, quote: ep.quote, answers: ep.answers, pack: 'xnk' }, R.story[cur],
      cur + 1 < n ? 'Sang ' + st.episodes[cur + 1].day : 'Đọc lại từ đầu', function () { state.ep++; scene++; playStory(false); });
  }

  function playOdd() {
    var items = C.items.filter(function (it) { return it.type === 'odd'; });
    var it = items[state.idx % items.length], token = scene;
    $thread.innerHTML = ''; $tray.innerHTML = '';
    add('<div class="narr">Bạn sắp bấm gửi. Một trong ba câu dưới đây sẽ làm người nhận khựng lại.</div>');
    add('<div class="bubble in lead">' + esc(it.context) + '</div>');
    function draw(picked) {
      var done = picked !== null;
      $tray.innerHTML = '<div class="tray"><div class="tray-label">' + (done ? 'Kết quả' : 'Chạm vào câu nghe kỳ') + '</div>' + it.texts.map(function (t, k) {
        var cls = 'draft' + (done ? (k === it.odd ? ' odd' : ' fine') : '');
        return '<button class="' + cls + '" data-pick="' + k + '"' + (done ? ' disabled' : '') + '>' + (done && k === it.odd ? '<small>Câu nghe kỳ</small>' : '') + '<span>' + esc(t) + '</span></button>';
      }).join('') + (done ? '<div class="score">Đúng ' + state.right + ' / ' + state.tried + ' câu</div><button class="next" data-next="1">Câu tiếp theo</button>' : '') + '</div>';
    }
    draw(null);
    $tray.onclick = function (e) {
      if (token !== scene) return;
      var p = e.target.closest('[data-pick]');
      if (p && !p.disabled) {
        var k = Number(p.dataset.pick); state.tried++; if (k === it.odd) state.right++;
        add('<div class="coach"><h3>' + (k === it.odd ? 'Bạn chọn đúng.' : 'Chưa đúng.') + '</h3><p>' + esc(it.why) + '</p></div>');
        draw(k); return;
      }
      if (e.target.closest('[data-next]')) { state.idx++; scene++; playOdd(); }
    };
  }

  function play() { scene++; header(); if (state.mode === 'qa') playQa(); else if (state.mode === 'odd') playOdd(); else playStory(true); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.pack) { state.pack = t.dataset.pack; state.idx = 0; state.ep = 0; play(); }
    else if (t.dataset.mode) { state.mode = t.dataset.mode; state.idx = 0; state.ep = 0; play(); }
    else if (t.dataset.save) {
      var i = saved.indexOf(t.dataset.save); if (i === -1) saved.push(t.dataset.save); else saved.splice(i, 1);
      try { localStorage.setItem('oe_saved', JSON.stringify(saved)); } catch (err) {}
      var on = i === -1; t.setAttribute('aria-pressed', String(on)); t.textContent = on ? 'Đã lưu' : 'Lưu vào sổ tay'; header();
    } else if (t.dataset.speak) {
      try { var u = new SpeechSynthesisUtterance(t.dataset.speak); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (err) {}
    }
  });

  play();
})();
</script>
</body>
</html>
